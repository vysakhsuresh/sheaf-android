// Types the Compose compiler cannot see into, which Sheaf nonetheless treats as stable so that
// composables taking them stay skippable. Without this list every page row holding a Bitmap or a
// Uri is inferred unstable, and the whole screen recomposes on any state change.
//
// Each line is a promise the code has to keep: the compiler stops tracking these types and will
// not notice a mutation. A Bitmap in particular is genuinely mutable - pass a new instance when
// the pixels change rather than drawing into one that is already on screen, or the UI will show
// stale content with no recomposition to correct it. Same contract for File and Uri: treat them
// as values, never as handles you reach back through to mutate.
//
// One fully qualified name per line. Read by the composeCompiler block in app/build.gradle.kts.

// Read-only collection interfaces. The concrete instance behind one is usually an ArrayList or a
// LinkedHashMap, so the promise here is that nothing holds a mutable alias to a list already
// handed to a composable - build a new list instead.
kotlin.collections.Collection
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Iterable

// Rendered page bitmaps travel from PlatformPdfEngine through the viewer's cache into composables.
android.graphics.Bitmap

// Output and cache paths. Immutable as objects; what sits at the path is not.
java.io.File

// SAF document Uris, which every import and export is identified by.
android.net.Uri
